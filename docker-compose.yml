version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pinterest-db
    environment:
      MYSQL_ROOT_PASSWORD: Nikunj@0711
      MYSQL_DATABASE: pinterest
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./caps_back-main
    container_name: pinterest-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pinterest
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Nikunj@0711
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Cpfinal-master
      args:
        REACT_APP_API_BASE_URL: http://localhost:8080/api/v1
    container_name: pinterest-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data: